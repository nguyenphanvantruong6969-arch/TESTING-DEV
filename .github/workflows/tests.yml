name: Tests (rbda-kiosk)

# Chay TU DONG o moi lan day code va moi pull request. Truoc day bo test chi
# chay khi ai do bam tay de build ban phat hanh — loi lot vao nhanh chinh ma
# khong ai biet cho toi luc dong goi.
on:
  push:
  pull_request:

# Chi doc ma nguon. Job nay khong dang gi len GitHub.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check .

  test-linux:
    name: Bo test day du + giao dien that (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai goi
        run: pip install -r requirements-dev.txt
      # Test giao dien chay trinh duyet THAT. Khong co Chromium thi chung tu
      # bo qua va bo test van xanh — nen phai cai that o day, khong thi CI
      # xanh ma khong kiem gi ve giao dien.
      - name: Cai Chromium cho Playwright
        run: python -m playwright install --with-deps chromium
      - name: Chay test (kem do phu)
        run: python -m pytest -q --cov --cov-report=term
      # Chan truong hop Chromium cai hong ma test giao dien lang le bo qua.
      - name: Soat khong co test giao dien nao bi bo qua
        run: |
          python -m pytest -q -rs tests/test_giao_dien_upload.py > ket_qua.txt || true
          cat ket_qua.txt
          if grep -q "SKIPPED" ket_qua.txt; then
            echo "::error::Test giao dien bi bo qua — Chromium khong chay duoc tren CI"
            exit 1
          fi

  test-windows:
    name: Bo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Khong cai playwright tren Windows: test giao dien da chay o Linux.
      # O day bat loai loi CHI Windows moi co: duong dan gach nguoc, tep
      # mo chua dong nen khong xoa duoc, ten tep danh rieng (CON, NUL...).
      - name: Cai goi
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8.0,<10" "pillow>=10.0,<13"
      - name: Chay test
        run: python -m pytest -q
