<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" font-family="DejaVu Sans, sans-serif" font-size="15"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="185" y="40" text-anchor="middle" font-size="14" fill="#555" font-weight="700">THU THẬP</text><text x="640" y="40" text-anchor="middle" font-size="14" fill="#555" font-weight="700">MỘT CƠ SỞ DỮ LIỆU</text><rect x="400" y="60" width="480" height="540" rx="12" fill="#fffbe0" stroke="#b5a642" stroke-width="1.5"/><text x="640" y="84" text-anchor="middle" font-size="15" font-weight="700">Một Google Sheets mỗi đợt và đối tượng</text><rect x="40" y="100" width="290" height="90" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="185.0" y="140.0" text-anchor="middle">1. Học sinh, giáo viên</text><text x="185.0" y="160.0" text-anchor="middle">(Submitter) mở liên kết</text><rect x="40" y="230" width="290" height="90" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="185.0" y="260.0" text-anchor="middle">2. Google Forms</text><text x="185.0" y="280.0" text-anchor="middle">mở, đóng theo giờ,</text><text x="185.0" y="300.0" text-anchor="middle">kiểm tra đầu vào</text><path d="M185,190 V230" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="100" width="440" height="90" rx="8" fill="#e8f5e9" stroke="#4c9a5b" stroke-width="1.5"/><text x="640.0" y="130.0" text-anchor="middle" font-weight="700">RAW</text><text x="640.0" y="150.0" text-anchor="middle">tab phản hồi do Forms ghi</text><text x="640.0" y="170.0" text-anchor="middle">không script nào ghi, không sửa</text><rect x="420" y="230" width="440" height="70" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="640.0" y="260.0" text-anchor="middle" font-weight="700">nhat_ky</text><text x="640.0" y="280.0" text-anchor="middle">chỉ thêm dòng: quyết định, lỗi, lần xuất</text><rect x="420" y="330" width="440" height="70" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="640.0" y="360.0" text-anchor="middle" font-weight="700">hoc_sinh, clb, cau_hinh</text><text x="640.0" y="380.0" text-anchor="middle">danh sách lớp, chỉ tiêu, thông số đợt</text><rect x="420" y="440" width="440" height="100" rx="8" fill="#e3f0ff" stroke="#3b73c4" stroke-width="1.5"/><text x="640.0" y="475.0" text-anchor="middle" font-weight="700">phieu</text><text x="640.0" y="495.0" text-anchor="middle">raw_key, ma_hs, trang_thai, ly_do,</text><text x="640.0" y="515.0" text-anchor="middle">ban_giu, nguoi_duyet, thoi_gian_duyet</text><path d="M330,275 H375 V145 H420" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1030" y="110" width="350" height="180" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="1205.0" y="175.0" text-anchor="middle">3. Apps Script lô</text><text x="1205.0" y="195.0" text-anchor="middle">10 phút một lần, chỉ trong cửa sổ mở</text><text x="1205.0" y="215.0" text-anchor="middle">khoá, đọc RAW, upsert theo raw_key,</text><text x="1205.0" y="235.0" text-anchor="middle">ghi phieu và nhat_ky</text><rect x="1120" y="330" width="260" height="190" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="1250.0" y="390.0" text-anchor="middle">4. Quản trị viên</text><text x="1250.0" y="410.0" text-anchor="middle">(Administrator)</text><text x="1250.0" y="430.0" text-anchor="middle">tab dieu_khien, menu: duyệt,</text><text x="1250.0" y="450.0" text-anchor="middle">từ chối, đổi phiếu giữ,</text><text x="1250.0" y="470.0" text-anchor="middle">chốt đợt</text><rect x="1030" y="10" width="350" height="60" rx="8" fill="#fff3e0" stroke="#d08a2e" stroke-width="1.5"/><text x="1205.0" y="45.0" text-anchor="middle">Email: lỗi, tóm tắt hằng ngày, lô ngừng</text><rect x="1030" y="550" width="350" height="80" rx="8" fill="#f3e5f5" stroke="#8a56a8" stroke-width="1.5"/><text x="1205.0" y="585.0" text-anchor="middle">Sao lưu hằng ngày và khi chốt</text><text x="1205.0" y="605.0" text-anchor="middle">sang thư mục Drive riêng</text><path d="M1030,145 H860" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1030,265 H860" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1060,290 V515 H860" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1120,465 H860" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1205,110 V70" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M880,590 H1030" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="420" y="650" width="440" height="60" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="640.0" y="675.0" text-anchor="middle">5. Apps Script xuất</text><text x="640.0" y="695.0" text-anchor="middle">chỉ phiếu da_duyet và ban_giu = 1</text><rect x="420" y="740" width="440" height="60" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="640.0" y="765.0" text-anchor="middle">Tệp trên Drive: RAW_PHIEU (19 cột và cột lop)</text><text x="640.0" y="785.0" text-anchor="middle">kèm DAP_AN.xlsx</text><rect x="420" y="830" width="440" height="60" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="640.0" y="855.0" text-anchor="middle">6. Skill xu-li-raw-forms</text><text x="640.0" y="875.0" text-anchor="middle">chạy ngoại tuyến, ra SO_NHAP_CLB.xlsx</text><rect x="420" y="920" width="440" height="60" rx="8" fill="#eef2ff" stroke="#6b7bd6" stroke-width="1.5"/><text x="640.0" y="945.0" text-anchor="middle">7. Kiosk RB-DA</text><text x="640.0" y="965.0" text-anchor="middle">nạp Sổ nhập, chạy xếp</text><path d="M640,540 V650" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M640,710 V740" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M640,800 V830" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M640,890 V920" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="636" text-anchor="middle" font-size="14" fill="#555" font-weight="700">ĐẦU RA</text></svg>